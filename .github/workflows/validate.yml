name: Validate Rstream

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check JavaScript syntax
        run: |
          node --check backend/server.js
          node --check backend/middleware/adminAuth.js
          node --check backend/routes/content.js
          node --check backend/routes/category.js
          node --check backend/routes/settings.js
          node --check frontend/streaming/js/app.js
          node --check frontend/admin/js/app.js
